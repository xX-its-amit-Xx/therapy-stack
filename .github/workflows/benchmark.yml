name: blinded-benchmark

# Runs the blinded benchmark on every PR and on every push to main.
#
# CPU-only Llama runs would take >1 hr in GitHub Actions; the public CI
# uses Anthropic Claude via API for speed, gated behind a repository
# secret. If ANTHROPIC_API_KEY isn't set the workflow skips the actual
# benchmark and only validates that the harness imports + the YAML
# benchmarks parse + baselines compute.

on:
  pull_request:
    branches: [main]
    paths:
      - "sandbox/**"
      - ".github/workflows/benchmark.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      set:
        description: "Which split (dev | val | all)"
        default: "dev"
        type: choice
        options: [dev, val, all]

permissions:
  contents: read
  pull-requests: write   # so the regression check can post the comparison comment

jobs:
  smoke:
    name: smoke -- baselines + YAML validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          fetch-depth: 1

      - name: Check out therapy-agent sibling
        uses: actions/checkout@v4
        with:
          repository: xX-its-amit-Xx/therapy-agent
          path: therapy-agent
          fetch-depth: 1

      - name: Check out fda-strategy-triples sibling
        uses: actions/checkout@v4
        with:
          repository: xX-its-amit-Xx/fda-strategy-triples
          path: fda-strategy-triples
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (no LLM)
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e ./fda-strategy-triples --no-deps
          pip install -e ./therapy-agent --no-deps

      - name: Unit tests (scoring + helpers)
        run: pytest tests/ -v

      - name: Benchmark YAML lint (schema + leakage)
        # Static check: every YAML has the required fields AND the input
        # block doesn't contain FDA drug / brand names that would leak
        # the answer to the LLM. Catches the v0.2 -> v0.3 leakage class
        # before it gets merged.
        run: python scripts/benchmark_lint.py

      - name: Prompt leakage lint
        # Static check: system prompts must not contain target symbols or
        # specific aliases from dev / val / adversarial benchmark cases.
        # Catches the v0.11 prompt-leakage class before it gets merged.
        run: python scripts/prompt_leakage_lint.py

      - name: Docstring lint (every script in scripts/)
        run: python scripts/docs_lint.py

      - name: Val-integrity check (no edits to held-out cases)
        # Fails the PR if a val case (benchmarks/heldout_2024_2025/*)
        # is touched without --allow-val-edit. Editing a val case in
        # response to a result invalidates the held-out claim; see
        # RUNBOOK section 8 for the proper quarterly rotation.
        run: python scripts/val_integrity_check.py

      - name: Validate YAML benchmarks parse
        working-directory: sandbox
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from run_blinded import load_cases
          for s in ('dev', 'val', 'adversarial', 'all'):
              cases = load_cases(s)
              assert all('input' in c and 'expected_outputs' in c for c in cases)
              print(f'{s} set: {len(cases)} cases OK')
          "

      - name: Compute baselines (no LLM)
        working-directory: sandbox
        # THERAPY_AGENT_LLM_BACKEND is set but unused here; baselines don't call the LLM.
        env:
          THERAPY_AGENT_LLM_BACKEND: anthropic
        run: |
          python run_blinded.py --baselines-only --set ${{ github.event.inputs.set || 'all' }}

  benchmark:
    name: blinded benchmark (Anthropic)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOTE: cannot gate on `secrets.X != ''` at job level -- the secrets
    # context is not available in job-level `if:`. Each step that uses
    # the secret is gated individually via env + step-level `if:` below.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xX-its-amit-Xx/therapy-agent
          path: therapy-agent
      - uses: actions/checkout@v4
        with:
          repository: xX-its-amit-Xx/fda-strategy-triples
          path: fda-strategy-triples
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (Anthropic backend)
        if: env.HAS_ANTHROPIC_KEY == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e ./fda-strategy-triples --no-deps
          pip install -e ./therapy-agent --no-deps

      - name: Run benchmark on dev set
        if: env.HAS_ANTHROPIC_KEY == 'true'
        working-directory: sandbox
        env:
          THERAPY_AGENT_LLM_BACKEND: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
        run: python run_blinded.py --set dev --out dev_results.json

      - name: Run benchmark on val set
        if: env.HAS_ANTHROPIC_KEY == 'true'
        working-directory: sandbox
        env:
          THERAPY_AGENT_LLM_BACKEND: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-6
        run: python run_blinded.py --set val --out val_results.json

      - name: Regression check
        id: regression
        if: env.HAS_ANTHROPIC_KEY == 'true'
        working-directory: sandbox
        run: |
          python ../scripts/regression_check.py \
            --dev dev_results.json \
            --val val_results.json \
            --baseline ../baselines.json

      - name: Download main-branch baseline run for diff
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          workflow: benchmark.yml
          branch: main
          name_is_regexp: true
          name: benchmark-results-.*
          path: baseline_artifacts/
          if_no_artifact_found: warn

      - name: Per-case diff vs main baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          if [ -f baseline_artifacts/dev_results.json ]; then
            python scripts/run_diff.py \
              --baseline baseline_artifacts/dev_results.json \
              --candidate sandbox/dev_results.json \
              --label "dev: main -> PR ${{ github.event.number }}" \
              > diff_dev.md
            echo "::group::dev diff"
            cat diff_dev.md
            echo "::endgroup::"
          fi
          if [ -f baseline_artifacts/val_results.json ]; then
            python scripts/run_diff.py \
              --baseline baseline_artifacts/val_results.json \
              --candidate sandbox/val_results.json \
              --label "val: main -> PR ${{ github.event.number }}" \
              > diff_val.md
            echo "::group::val diff"
            cat diff_val.md
            echo "::endgroup::"
          fi

      - name: Post diff as PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark-diff
          path: |
            diff_dev.md
            diff_val.md

      - name: Calibration analysis
        continue-on-error: true
        run: |
          python scripts/calibration.py \
            sandbox/dev_results.json \
            sandbox/val_results.json \
            > calibration.md
          echo "::group::calibration"
          cat calibration.md
          echo "::endgroup::"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            sandbox/dev_results.json
            sandbox/val_results.json
            diff_dev.md
            diff_val.md
            calibration.md
          retention-days: 30
